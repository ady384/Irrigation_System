    function hexToBuffere(hex) {
  return new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
}function bufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

// string base64 -> Uint8Array (robust, acceptă și base64url)
function base64ToBuffer(base64) {
    if (typeof base64 !== 'string') {
        throw new Error("base64ToBuffer: input nu e string, e " + typeof base64);
    }
    let s = base64.trim().replace(/\s+/g, '');
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4 !== 0) s += '=';

    const binary = atob(s);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
}


async function doAllTheDecrypt(encryptedData) {
    // encryptedData trebuie să fie string base64
    if (typeof encryptedData !== 'string') {
        if (encryptedData instanceof Uint8Array || encryptedData instanceof ArrayBuffer) {
            encryptedData = bufferToBase64(encryptedData);
        } else {
            throw new Error("doAllTheDecrypt: input invalid, tip=" + typeof encryptedData);
        }
    }

    const key = hexToBuffere(localStorage.getItem("key1"));
    const iv  = hexToBuffere(localStorage.getItem("iv"));

    const cryptoKey = await crypto.subtle.importKey(
        "raw", key, { name: "AES-CBC" }, false, ["decrypt"]
    );

    const encryptedBuffer = base64ToBuffer(encryptedData);

    const decryptedBuffer = await crypto.subtle.decrypt(
        { name: "AES-CBC", iv },
        cryptoKey,
        encryptedBuffer
    );

    // 1. transformăm ArrayBuffer -> string
    let text = new TextDecoder().decode(decryptedBuffer);

    // 2. fallback pentru datele vechi criptate cu bug-ul (ex: "68,85,80")
    if (/^\d+(,\d+)*$/.test(text)) {
        try {
            const bytes = new Uint8Array(text.split(',').map(Number));
            text = new TextDecoder().decode(bytes);
        } catch (e) {
            // dacă nu merge, lăsăm textul așa cum e
        }
    }

    // 3. log corect
    console.log("decrypted:", text);

    return text;
}
